name: Build Neovim for armhf-1

on:
  workflow_dispatch:
    inputs:
      nvim_version:
        description: 'Neovim 版本分支或标签 (例如: stable, master, v0.12.6)'
        required: true
        default: 'stable'

jobs:
  build-armhf:
    runs-on: ubuntu-latest
    steps:
      - name: 设置 QEMU 模拟器以支持 armhf
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: all

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: 在 armhf 容器中拉取源码并编译
        env:
          NVIM_VERSION: ${{ github.event.inputs.nvim_version }}
        run: |
          docker run --rm --platform linux/arm/v7 \
            -e NVIM_VERSION="$NVIM_VERSION" \
            -v "${{ github.workspace }}:/workspace" \
            debian:bookworm-slim \
            bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -y --no-install-recommends \
                ca-certificates git ninja-build gettext cmake unzip curl build-essential

              REPO_URL="https://""github.com/neovim/neovim.git"
              git clone --depth 1 --branch "$NVIM_VERSION" \
                "$REPO_URL" /tmp/neovim

              cd /tmp/neovim
              make CMAKE_BUILD_TYPE=Release CMAKE_INSTALL_PREFIX=/tmp/nvim-armhf
              make install

              tar -czvf /workspace/nvim-linux-armhf.tar.gz -C /tmp/nvim-armhf .
            '

      - name: 上传编译产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: nvim-linux-armhf
          path: nvim-linux-armhf.tar.gz

