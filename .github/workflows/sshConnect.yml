          # echo "已经进入局域网（IP 已固定），请随时连入..."
          # 💡 直接借用 Linux 自带的 sleep 锁，控制阻塞时间为 1800 秒（30分钟）
          # sleep 1800 

      - name: 安装 Vscode Cli并伪造本地登录状态
        env:
          # 确保你在仓库 Secret 里配置的 VSCODE_TUNNEL_TOKEN 确实是那串 Base64 密文
          VSCODE_TUNNEL_AUTH: ${{ secrets.VSCODE_TUNNEL_TOKEN }}
        run: |
          # 1. 下载并解压 CLI
          curl -sSLk 'https://code.visualstudio.com/sha/download?build=stable&os=cli-alpine-x64' --output vscode_cli.tar.gz
          tar -xf vscode_cli.tar.gz
          ./code --version
          
          # 4. 启动隧道（此时已经拥有了本地登录状态）
         ./code tunnel --accept-server-license-terms --provider github --access-token "$VSCODE_TUNNEL_AUTH" --name actions-runner-${{ github.run_id }

      # # https://github.com/marketplace/actions/run-vscode-server
      # - name: Run VSCode Server
      #   uses: zongou/run-vscode-server@0.0.7


      - name: Restore Fixed  Host Key
        run: |
          # 1. 写入固定的 ed25519 私钥
          echo "${{ secrets.SSH_HOST_ED25519_KEY }}" | sudo tee /etc/ssh/ssh_host_ed25519_key > /dev/null
          echo "${{ secrets.SSH_HOST_RSA_KEY }}" | sudo tee /etc/ssh/ssh_host_rsa_key > /dev/null
          echo "${{ secrets.SSH_HOST_ECDSA_KEY }}" | sudo tee /etc/ssh/ssh_host_ecdsa_key > /dev/null
          
          # 2. 删除原有的 ed25519 公钥，逼系统重新生成
          sudo rm -f /etc/ssh/ssh_host_ed25519_key.pub
          sudo rm -f /etc/ssh/ssh_host_rsa_key.pub
          sudo rm -f /etc/ssh/ssh_host_ecdsa_key.pub
          
          # 3. 严格设置私钥权限
          sudo chmod 600 /etc/ssh/ssh_host_ed25519_key
          sudo chmod 600 /etc/ssh/ssh_host_rsa_key
          sudo chmod 600 /etc/ssh/ssh_host_ed25519_key
          sudo chown root:root /etc/ssh/ssh_host_ecdsa_key
          sudo chown root:root /etc/ssh/ssh_host_rsa_key
          sudo chown root:root /etc/ssh/ssh_host_ed25519_key
          
          # 4. 重启 SSH 服务让它重新推导公钥并生效
          sudo systemctl restart ssh || sudo service ssh restart


      - name: Wait for SSH (Up to 6 hours)
        run: |
          # 关键：用 sudo 创建这个文件，并把所有权给 runner 用户，确保后续两边都能读写
          # sudo touch /c
          # sudo chown runner:runner /c
          # rm -f /c 
          # 先删掉，让循环开始挂起
          
          # 循环检查文件是否存在，最多等待 5 分钟 (30次 * 10秒)
          COUNTER=0
          while [ ! -f "$HOME/c" ]; do
            if [ $COUNTER -ge 360 ]; then
                echo "超时：未找到文件"
                exit 0
            fi
            echo "等待中... 已挂起 $COUNTER 分钟。在终端执行 touch c 即可退出。"
            sleep 60  
            # 关键：加入 sleep 确保 CPU 占用为 0
            COUNTER=$((COUNTER+1))
          done
          echo "文件已就绪，继续执行！"
          

