# This is a basic workflow to help you get started with Actions

name: SSHConnect

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  # push:
    # branches: [ "main" ]
  # pull_request:
    # branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.

      # - run : |
      #     ls -la / > 1.txt
      #     pwd >> 1.txt
      #     cat 1.txt

      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: my-project-assets    # 给你的文件包起个名字（在网页端看到的也是这个名字）
      #     path: |                    # 可以是文件，也可以是文件夹
      #       1.txt                    
      #       README.md                 
      #     retention-days: 7         # [可选] 设置在云端只保存 7 天


      # - name: ZeroTier
      #   uses: zerotier/github-action@v1.0.1
      #   with:
      #     network_id: ${{ secrets.ZEROTIER_NETWORK_ID }}
      #     auth_token: ${{ secrets.ZEROTIER_CENTRAL_TOKEN }}
      #     # 注入提前准备好的身份私钥，以此保证 Node ID 绝不改变
      #     secret_identity: ${{ secrets.ZEROTIER_IDENTITY_SECRET }}
      

      - name: Install and Connect ZeroTier with Fixed Identity
        run : |
          curl -s https://install.zerotier.com | sudo bash

      - name: Connect ZeroTier with Fixed Identity
        run : |
          # 6. 彻底停止由于安装自动启动的服务，防止干扰
          sudo systemctl stop zerotier-one

          # 7. 物理粉碎可能自动生成的临时身份文件
          sudo mkdir -p /var/lib/zerotier-one
          sudo rm -f /var/lib/zerotier-one/identity.secret
          sudo rm -f /var/lib/zerotier-one/identity.public

          # 8. 强行注入你的固定私钥
          echo "${{ secrets.ZEROTIER_IDENTITY_SECRET }}" | sudo tee /var/lib/zerotier-one/identity.secret > /dev/null
          sudo chmod 600 /var/lib/zerotier-one/identity.secret

          # 9. 重新启动服务并强制加入网络
          sudo systemctl start zerotier-one
          sleep 2
          sudo zerotier-cli join ${{ secrets.ZEROTIER_NETWORK_ID }}

          # 10. 打印当前的真实 Node ID 供验证
          echo "========================================="
          echo "当前虚拟机的真正固定 Node ID 是："
          sudo zerotier-cli info
          echo "========================================="


      # 测试连接（可选）
      - name: Ping Internal Server
        run: |
          echo "等待 ZeroTier 节点完全握手并获取局域网 IP..."
          # 强制等待 15 秒给网络一点打洞和获取 IP 的时间
          sleep 15 

          echo "=== 当前虚拟机网卡分配到的真实内网 IP 状态 ==="
          sudo zerotier-cli listnetworks
          echo "=============================================="

          echo "My ZeroTier IP is holding fixed."
          ping -c 4 192.168.196.100

      
          # 2. 调用大神的智能调试插件（只负责开启本地 SSH 和状态感知阻塞）
      - name: Setup Intelligent SSH Debugger
        uses: csexton/debugger-action@v1
        with:
          # 该插件非常聪明，会自动抓取你在 GitHub 账号里绑定过的所有公钥，省去你配公钥的麻烦
          #（你也可以手动指定公钥，详情见其文档）
          github-user: ${{ github.actor }} 


