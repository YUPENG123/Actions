# This is a basic workflow to help you get started with Actions

name: CI by yp 

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  # push:
    # branches: [ "main" ]
  # pull_request:
    # branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.

      - run : |
          ls -la / > 1.txt
          pwd >> 1.txt
          cat 1.txt
          whoami
          echo $HOME
          id
          sudo -l
          ssh -V

      - run : |
          mkdir -p ~/.ssh  && curl https://github.com/YUPENG123.keys >> ~/.ssh/authorized_keys
          cat ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys

      - run : |
          # sudo apt update && sudo apt install ZeroTier-one
          # 安装 GPG 密钥下载工具
          # sudo apt-get update
          # sudo apt-get install -y curl gnupg
          gpg --version

      - name: Install ZeroTier via APT
        run: |
           echo "显示pgp"
           # cat /usr/share/keyrings/zerotier-archive-keyring.gpg
           
           # 1. 下载并添加 ZeroTier 官方 GPG 密钥
           curl -fsSL "https://raw.githubusercontent.com/zerotier/ZeroTierOne/master/doc/contact%40zerotier.com.gpg" | sudo gpg --dearmor -o /usr/share/keyrings/zerotier-archive-keyring.gpg
           cat /usr/share/keyrings/zerotier-archive-keyring.gpg
           
           # 2. 将 ZeroTier 官方源写入系统的 apt 列表中（自动适配当前 Ubuntu 版本代号）
           echo "deb [signed-by=/usr/share/keyrings/zerotier-archive-keyring.gpg] https://download.zerotier.com/debian/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/zerotier.list
           cat /etc/apt/sources.list.d/zerotier.list

           # 3. 更新 apt 缓存并安装 zerotier-one
           sudo apt-get update
           sudo apt-get install -y zerotier-one

      # - uses: actions/upload-artifact@v7
      #   with:
      #     name: my-project-assets    # 给你的文件包起个名字（在网页端看到的也是这个名字）
      #     path: |                    # 可以是文件，也可以是文件夹
      #       1.txt                    
      #       README.md                 
      #     retention-days: 7         # [可选] 设置在云端只保存 7 天
